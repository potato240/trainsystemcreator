<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Train System Creator</title>
<style>
  :root {
    --amber: #e8a33d;
    --amber-dark: #c07f22;
    --green: #3f7d4a;
    --green-dark: #35643d;
    --panel: rgba(30, 26, 20, 0.88);
    --panel-border: #5a4a34;
    --ink: #f4ead9;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #2b4a2f;
  }
  #canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    cursor: crosshair;
  }
  #toolbar {
    position: fixed;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--panel);
    border: 2px solid var(--panel-border);
    border-radius: 12px;
    padding: 8px 10px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.35);
    z-index: 10;
    max-width: 92vw;
    flex-wrap: wrap;
    row-gap: 6px;
  }
  #toolbar .brand {
    color: var(--amber);
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.03em;
    padding: 0 10px 0 4px;
    border-right: 1px solid var(--panel-border);
    margin-right: 4px;
    white-space: nowrap;
  }
  button.tool {
    background: #3a2f22;
    color: var(--ink);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 7px 12px;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.12s, transform 0.05s;
    white-space: nowrap;
  }
  button.tool:hover { background: #4a3d2c; }
  button.tool:active { transform: scale(0.96); }
  button.tool.active {
    background: var(--amber);
    color: #2b1f0e;
    border-color: var(--amber-dark);
    font-weight: 600;
  }
  button.tool.danger { color: #e8734d; }
  button.tool.danger:hover { background: #4d2c22; }
  button.tool.toggle.active {
    background: #5cb3e8;
    color: #0e2433;
    border-color: #2c6f96;
  }

  #hint {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--ink);
    font-size: 12.5px;
    padding: 8px 14px;
    border-radius: 10px;
    z-index: 10;
    pointer-events: none;
    max-width: 90vw;
    text-align: center;
  }
  #livery {
    position: fixed;
    top: 14px;
    left: 14px;
    background: var(--panel);
    border: 2px solid var(--panel-border);
    border-radius: 12px;
    padding: 8px 12px;
    z-index: 10;
    color: var(--ink);
    font-size: 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  #livery .title {
    color: var(--amber);
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.03em;
  }
  #livery label {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #livery input[type="color"] {
    width: 26px;
    height: 22px;
    padding: 0;
    border: 1px solid var(--panel-border);
    border-radius: 4px;
    background: none;
    cursor: pointer;
  }
  #stats {
    position: fixed;
    top: 14px;
    right: 14px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--ink);
    font-size: 12px;
    padding: 8px 12px;
    border-radius: 10px;
    z-index: 10;
    line-height: 1.5;
  }
</style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <div id="livery">
    <span class="title">Train Livery</span>
    <label>Roof <input type="color" id="roofColor" value="#d7dbda"></label>
    <label>Side <input type="color" id="sideColor" value="#1d4f91"></label>
    <label>Cab <input type="color" id="cabColor" value="#e8c93d"></label>
  </div>

  <div id="toolbar">
    <span class="brand">🚆 Track Editor</span>
    <button class="tool active" data-mode="node">Add Node</button>
    <button class="tool" data-mode="connect">Connect</button>
    <button class="tool" data-mode="station">Add Station</button>
    <button class="tool" data-mode="depot">Add Depot</button>
    <button class="tool" data-mode="route">Route</button>
    <button class="tool" data-mode="road">Add Road</button>
    <button class="tool" data-mode="crossing">Add Crossing</button>
    <button class="tool" data-mode="select">Select / Move</button>
    <button class="tool toggle" id="doubleToggle">Double Track: Off</button>
    <button class="tool" id="spawnBtn">Spawn Train</button>
    <button class="tool danger" id="clearBtn">Clear All</button>
  </div>

  <div id="stats">Nodes: <span id="nodeCount">0</span><br>Tracks: <span id="trackCount">0</span><br>Facilities: <span id="facilityCount">0</span><br>Trains: <span id="trainCount">0</span><br>Passengers: <span id="passengerCount">0</span><br>Roads: <span id="roadCount">0</span><br>Cars: <span id="carCount">0</span></div>

  <div id="hint">Click empty ground to place a rail node.</div>

<script>
(() => {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const hint = document.getElementById('hint');
  const nodeCountEl = document.getElementById('nodeCount');
  const trackCountEl = document.getElementById('trackCount');
  const facilityCountEl = document.getElementById('facilityCount');
  const trainCountEl = document.getElementById('trainCount');
  const passengerCountEl = document.getElementById('passengerCount');
  const roadCountEl = document.getElementById('roadCount');
  const carCountEl = document.getElementById('carCount');
  const STORAGE_KEY = 'tsc_track_state_v2';

  // Reference rolling stock: a 4-car Southeastern Class 375 "Electrostar" EMU.
  // Each car is ~20m in real life; platforms/depots are locked to this total
  // length so they can never be built shorter or longer than the train itself.
  const TRAIN_CARS = 4;
  const CAR_LENGTH = 42;
  const TRAIN_LENGTH = CAR_LENGTH * TRAIN_CARS;
  const TRAIN_WIDTH = 22;
  const PLATFORM_WIDTH = 32;
  const PLATFORM_GAP = 6;
  // The train runs along the facility track's own centerline; the platform
  // sits beside it, offset perpendicular by half the train, the gap, and
  // half the platform - never on top of the rails themselves.
  const PLATFORM_OFFSET = TRAIN_WIDTH / 2 + PLATFORM_GAP + PLATFORM_WIDTH / 2;
  // Separation between the two lanes of a double track.
  const DOUBLE_GAP = 22;
  const TRAIN_SPEED = 70; // px/s
  const STOP_SECONDS = 3; // dwell time at a station stop or an end-of-line reversal
  const WALK_SPEED = 40; // px/s
  const WALK_DISTANCE = 260; // px - stations this close are walkable directly
  const PASSENGER_SPAWN_SECONDS = 4;
  const PASSENGER_COLORS = ['#e8734d', '#5cb3e8', '#8bd17c', '#e8c93d', '#c78be8', '#f2946b'];
  const GRID_SIZE = 40; // roads snap to this grid and may only run in the 8 grid directions
  const CROSSING_SNAP_DIST = GRID_SIZE / 2; // roads this close to a rail node snap onto it exactly
  const CROSSING_TRIGGER_DIST = 180; // px - a train this close to a crossing lowers its barriers
  const CAR_SPEED = 55; // px/s
  const CAR_SPAWN_SECONDS = 3;
  const MAX_CARS = 10;
  const CAR_STOP_T = 0.88; // how far along its final segment a car halts before a closed crossing
  const CAR_COLORS = ['#c0392b', '#2c6f96', '#4a7c3f', '#c78be8', '#e8a33d', '#7d8180'];

  function resize() {
    canvas.width = window.innerWidth * devicePixelRatio;
    canvas.height = window.innerHeight * devicePixelRatio;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
    draw();
  }
  window.addEventListener('resize', resize);

  // ---- state ----
  let nodes = [];       // {id, x, y, double}
  let tracks = [];      // {id, aId, bId, c1off, c2off, c1locked, c2locked, double}
  let facilities = [];  // {id, kind:'station'|'depot', x, y, angle, nodeId, farNodeId, trackId, double}
  let trains = [];      // {id, depotId, path:[nodeId...], pts, cum, total, pos, dir, speed}
  let passengers = [];  // {id, originId, destId, atStationId, state, x, y, color, trainId, walk}
  let passengerSpawnTimer = 0;
  let roadNodes = [];   // {id, x, y} - always grid-snapped
  let roadSegments = []; // {id, aId, bId} - straight, one of the 8 grid directions
  let cars = [];        // {id, fromId, toId, t, x, y, angle, speed, color, state}
  let carSpawnTimer = 0;
  let nextId = 1;

  let mode = 'node';
  let doubleTrack = false;
  let pendingConnectNode = null;
  let pendingRoute = null; // {depotId, path:[nodeId...]}
  let lastRoadNodeId = null; // chains consecutive clicks in Add Road mode into a polyline
  let selected = null; // {type:'node'|'track'|'facility'|'roadNode'|'roadSegment', id}
  let dragging = null;
  let mouse = { x: 0, y: 0 };
  let livery = { roof: '#d7dbda', side: '#1d4f91', cab: '#e8c93d' };

  function uid() { return nextId++; }
  function getNode(id) { return nodes.find(n => n.id === id); }
  function getTrack(id) { return tracks.find(t => t.id === id); }
  function getFacility(id) { return facilities.find(f => f.id === id); }
  function getRoadNode(id) { return roadNodes.find(n => n.id === id); }
  function getRoadSegment(id) { return roadSegments.find(s => s.id === id); }

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      nodes, tracks, facilities, trains, nextId, livery, roadNodes, roadSegments,
    }));
  }
  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      const data = JSON.parse(raw);
      if (data.nodes && data.tracks) {
        nodes = data.nodes;
        tracks = data.tracks;
        facilities = data.facilities || [];
        trains = data.trains || [];
        roadNodes = data.roadNodes || [];
        roadSegments = data.roadSegments || [];
        if (data.livery) livery = { ...livery, ...data.livery };
        nextId = data.nextId || (Math.max(0,
          ...nodes.map(n => n.id), ...tracks.map(t => t.id),
          ...facilities.map(f => f.id), ...trains.map(t => t.id),
          ...roadNodes.map(n => n.id), ...roadSegments.map(s => s.id)) + 1);
      }
    } catch (e) { /* ignore corrupt state */ }
  }

  function addNode(x, y) {
    const n = { id: uid(), x, y, double: doubleTrack };
    nodes.push(n);
    save();
    return n;
  }

  function addTrack(aId, bId) {
    if (aId === bId) return null;
    const existing = tracks.find(t => (t.aId === aId && t.bId === bId) || (t.aId === bId && t.bId === aId));
    if (existing) return existing;
    const a = getNode(aId), b = getNode(bId);
    const dx = (b.x - a.x) / 3, dy = (b.y - a.y) / 3;
    const track = {
      id: uid(), aId, bId,
      c1off: { x: dx, y: dy },
      c2off: { x: -dx, y: -dy },
      c1locked: false,
      c2locked: false,
      double: doubleTrack,
    };
    tracks.push(track);
    recomputeAutoTangents();
    save();
    return track;
  }

  function trackBetween(aId, bId) {
    return tracks.find(t => (t.aId === aId && t.bId === bId) || (t.aId === bId && t.bId === aId));
  }

  function deleteNode(id) {
    nodes = nodes.filter(n => n.id !== id);
    tracks = tracks.filter(t => t.aId !== id && t.bId !== id);
    facilities = facilities.filter(f => f.nodeId !== id && f.farNodeId !== id);
    pruneInvalidTrains();
    recomputeAutoTangents();
    save();
  }
  function deleteTrack(id) {
    tracks = tracks.filter(t => t.id !== id);
    facilities = facilities.filter(f => f.trackId !== id);
    pruneInvalidTrains();
    recomputeAutoTangents();
    save();
  }

  // Roads snap to a fixed grid and may only run in the 8 grid directions
  // (N/S/E/W and the 4 diagonals) - straight segments between grid points.
  function snapToGrid(x, y) {
    return { x: Math.round(x / GRID_SIZE) * GRID_SIZE, y: Math.round(y / GRID_SIZE) * GRID_SIZE };
  }

  // Angle-tolerant so a road snapped exactly onto a rail node (which isn't
  // necessarily grid-aligned) still validates - plain grid points satisfy
  // this exactly anyway since their offsets are always multiples of 45deg.
  function isGridDirection(a, b) {
    const dx = b.x - a.x, dy = b.y - a.y;
    if (dx === 0 && dy === 0) return false;
    const deg = Math.atan2(dy, dx) * 180 / Math.PI;
    const mod = ((deg % 45) + 45) % 45;
    const tolerance = 6;
    return mod < tolerance || mod > 45 - tolerance;
  }

  // Places a road point at an exact position (no grid-snap) - used when the
  // click lands close enough to an existing rail node that the road should
  // meet it exactly, so a crossing there lines up with the road precisely.
  function addRoadNodeAt(x, y) {
    const existing = roadNodes.find(n => n.x === x && n.y === y);
    if (existing) return existing;
    const n = { id: uid(), x, y };
    roadNodes.push(n);
    save();
    return n;
  }

  function addRoadNode(x, y) {
    const p = snapToGrid(x, y);
    return addRoadNodeAt(p.x, p.y);
  }

  // A rail node within CROSSING_SNAP_DIST of a grid-snapped click, if any -
  // roads snap onto it exactly instead of the grid point.
  function nearbyRailNode(x, y) {
    let best = null, bestDist = CROSSING_SNAP_DIST;
    for (const n of nodes) {
      const d = Math.hypot(n.x - x, n.y - y);
      if (d < bestDist) { bestDist = d; best = n; }
    }
    return best;
  }

  function addRoadSegment(aId, bId) {
    if (aId === bId) return null;
    const existing = roadSegments.find(s => (s.aId === aId && s.bId === bId) || (s.aId === bId && s.bId === aId));
    if (existing) return existing;
    const a = getRoadNode(aId), b = getRoadNode(bId);
    if (!isGridDirection(a, b)) return null;
    const seg = { id: uid(), aId, bId };
    roadSegments.push(seg);
    save();
    return seg;
  }

  function deleteRoadNode(id) {
    roadNodes = roadNodes.filter(n => n.id !== id);
    roadSegments = roadSegments.filter(s => s.aId !== id && s.bId !== id);
    save();
  }
  function deleteRoadSegment(id) {
    roadSegments = roadSegments.filter(s => s.id !== id);
    save();
  }

  // A facility (station or depot) is a platform/shed locked to exactly
  // TRAIN_LENGTH, built by dragging out from an existing rail node - only
  // position/angle are adjustable, and it always comes with its own
  // connecting track running the full length. Depots are where trains spawn.
  function addFacility(kind, x, y, angle, nodeId, farNodeId, trackId) {
    const f = { id: uid(), kind, x, y, angle, nodeId, farNodeId, trackId, double: doubleTrack };
    facilities.push(f);
    save();
    return f;
  }
  function deleteFacility(id) {
    facilities = facilities.filter(f => f.id !== id);
    trains = trains.filter(t => t.depotId !== id);
    save();
  }

  // For a node with exactly two connections, align both tracks' tangents so
  // the curve flows straight through instead of kinking at the node. Nodes
  // with one connection aim at their only neighbor; junctions (3+) fall back
  // to aiming straight at each neighbor since no single tangent fits all of
  // them. Handles the user has manually dragged (locked) are left alone.
  function nodeNeighbors(nodeId) {
    const list = [];
    for (const t of tracks) {
      if (t.aId === nodeId) list.push({ track: t, otherId: t.bId, end: 'a' });
      else if (t.bId === nodeId) list.push({ track: t, otherId: t.aId, end: 'b' });
    }
    return list;
  }

  function recomputeAutoTangents() {
    for (const node of nodes) {
      const neigh = nodeNeighbors(node.id);
      if (neigh.length === 0) continue;

      let tangent = null;
      if (neigh.length === 1) {
        const other = getNode(neigh[0].otherId);
        tangent = { x: other.x - node.x, y: other.y - node.y };
      } else if (neigh.length === 2) {
        const oA = getNode(neigh[0].otherId), oB = getNode(neigh[1].otherId);
        tangent = { x: oB.x - oA.x, y: oB.y - oA.y };
      }

      for (const n of neigh) {
        const lockedKey = n.end === 'a' ? 'c1locked' : 'c2locked';
        if (n.track[lockedKey]) continue;

        const other = getNode(n.otherId);
        const toOther = { x: other.x - node.x, y: other.y - node.y };
        const dist = Math.hypot(toOther.x, toOther.y) || 1;

        let dir;
        if (tangent) {
          const len = Math.hypot(tangent.x, tangent.y) || 1;
          dir = { x: tangent.x / len, y: tangent.y / len };
          if (dir.x * toOther.x + dir.y * toOther.y < 0) { dir.x *= -1; dir.y *= -1; }
        } else {
          dir = { x: toOther.x / dist, y: toOther.y / dist };
        }

        const mag = dist / 3;
        const off = { x: dir.x * mag, y: dir.y * mag };
        if (n.end === 'a') n.track.c1off = off; else n.track.c2off = off;
      }
    }
  }

  // ---- routing (for trains) ----
  function shortestPath(startId, endId) {
    if (startId === endId) return [startId];
    const visited = new Set([startId]);
    const prev = {};
    const queue = [startId];
    while (queue.length) {
      const cur = queue.shift();
      if (cur === endId) break;
      for (const nb of nodeNeighbors(cur)) {
        if (!visited.has(nb.otherId)) {
          visited.add(nb.otherId);
          prev[nb.otherId] = cur;
          queue.push(nb.otherId);
        }
      }
    }
    if (!visited.has(endId)) return null;
    const path = [endId];
    let cur = endId;
    while (cur !== startId) { cur = prev[cur]; path.push(cur); }
    path.reverse();
    return path;
  }

  function buildRouteGeometry(path) {
    let pts = [];
    const waypointIdx = [0]; // index into pts for each path[] node
    for (let i = 0; i < path.length - 1; i++) {
      const track = trackBetween(path[i], path[i + 1]);
      if (!track) return null;
      let segPts = trackPoints(track, 24);
      const startNode = getNode(path[i]);
      if (Math.hypot(segPts[0].x - startNode.x, segPts[0].y - startNode.y) > 1) {
        segPts = segPts.slice().reverse();
      }
      if (pts.length > 0) segPts = segPts.slice(1);
      pts = pts.concat(segPts);
      waypointIdx.push(pts.length - 1);
    }
    if (pts.length < 2) return null;
    const cum = [0];
    for (let i = 1; i < pts.length; i++) {
      cum.push(cum[i - 1] + Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y));
    }
    const waypointDist = waypointIdx.map(idx => cum[idx]);
    return { pts, cum, total: cum[cum.length - 1], waypointDist };
  }

  // Intermediate path nodes (not the route's start/end, which already get an
  // end-of-line dwell) that sit at a station stop there so passengers can board.
  // A station's platform spans its whole connecting track (nodeId to
  // farNodeId, exactly TRAIN_LENGTH long). When the route traverses that
  // full segment, stop once at its midpoint so the train lands centered on
  // the platform - not once at each end, which would leave only half the
  // train inside it each time.
  function computeStationStops(path, waypointDist) {
    const stops = [];
    const covered = new Set();
    for (const f of facilities) {
      if (f.kind !== 'station') continue;
      for (let i = 0; i < path.length - 1; i++) {
        const a = path[i], b = path[i + 1];
        if ((a === f.nodeId && b === f.farNodeId) || (a === f.farNodeId && b === f.nodeId)) {
          stops.push({ dist: (waypointDist[i] + waypointDist[i + 1]) / 2, nodeId: a, facilityId: f.id });
          covered.add(i);
          covered.add(i + 1);
        }
      }
    }
    for (let i = 1; i < path.length - 1; i++) {
      if (covered.has(i)) continue;
      const nodeId = path[i];
      const f = facilities.find(f => f.kind === 'station' && (f.nodeId === nodeId || f.farNodeId === nodeId));
      if (f) stops.push({ dist: waypointDist[i], nodeId, facilityId: f.id });
    }
    return stops;
  }

  // If a route's start/end node happens to sit at a station, treat the
  // end-of-line dwell there as a station arrival too (for boarding/alighting).
  function stationAtNode(nodeId) {
    const f = facilities.find(f => f.kind === 'station' && (f.nodeId === nodeId || f.farNodeId === nodeId));
    return f ? f.id : null;
  }

  function spawnTrain(depotId, path) {
    const geo = buildRouteGeometry(path);
    if (!geo) return null;
    const train = {
      id: uid(), depotId, path, pts: geo.pts, cum: geo.cum, total: geo.total,
      pos: 0, dir: 1, speed: TRAIN_SPEED,
      state: 'running', waitTimer: 0, pendingDir: null, lastStopDist: null,
      stationStops: computeStationStops(path, geo.waypointDist),
      startFacilityId: stationAtNode(path[0]),
      endFacilityId: stationAtNode(path[path.length - 1]),
    };
    trains.push(train);
    save();
    return train;
  }

  function pruneInvalidTrains() {
    trains = trains.filter(tr => {
      if (!getNode(tr.path[0])) return false;
      for (let i = 0; i < tr.path.length - 1; i++) {
        if (!trackBetween(tr.path[i], tr.path[i + 1])) return false;
      }
      return true;
    });
  }

  // Cars near either end of the train can sit at a distance outside [0,
  // total] once the train itself is close to an end of its route - extend
  // straight out along that end's tangent instead of clamping them all onto
  // the same endpoint, which used to collapse the whole train into one spot.
  function trainPoseAt(train, distAlong) {
    const { pts, cum, total } = train;

    if (distAlong < 0) {
      const p0 = pts[0], p1 = pts[1];
      const angle = Math.atan2(p1.y - p0.y, p1.x - p0.x);
      return { x: p0.x + Math.cos(angle) * distAlong, y: p0.y + Math.sin(angle) * distAlong, angle };
    }
    if (distAlong > total) {
      const pn = pts[pts.length - 1], pn1 = pts[pts.length - 2];
      const angle = Math.atan2(pn.y - pn1.y, pn.x - pn1.x);
      const extra = distAlong - total;
      return { x: pn.x + Math.cos(angle) * extra, y: pn.y + Math.sin(angle) * extra, angle };
    }

    let i = 1;
    while (i < cum.length - 1 && cum[i] < distAlong) i++;
    const segLen = cum[i] - cum[i - 1] || 1;
    const t = (distAlong - cum[i - 1]) / segLen;
    const p0 = pts[i - 1], p1 = pts[i];
    return {
      x: p0.x + (p1.x - p0.x) * t,
      y: p0.y + (p1.y - p0.y) * t,
      angle: Math.atan2(p1.y - p0.y, p1.x - p0.x),
    };
  }

  // ---- geometry helpers ----
  function bezierPt(t, p0, p1, p2, p3) {
    const mt = 1 - t;
    const a = mt * mt * mt, b = 3 * mt * mt * t, c = 3 * mt * t * t, d = t * t * t;
    return {
      x: a * p0.x + b * p1.x + c * p2.x + d * p3.x,
      y: a * p0.y + b * p1.y + c * p2.y + d * p3.y,
    };
  }

  function trackPoints(track, n = 40) {
    const a = getNode(track.aId), b = getNode(track.bId);
    if (!a || !b) return [];
    const c1 = { x: a.x + track.c1off.x, y: a.y + track.c1off.y };
    const c2 = { x: b.x + track.c2off.x, y: b.y + track.c2off.y };
    const pts = [];
    for (let i = 0; i <= n; i++) pts.push(bezierPt(i / n, a, c1, c2, b));
    return pts;
  }

  function offsetPolyline(pts, dist) {
    const out = [];
    for (let i = 0; i < pts.length; i++) {
      const p = pts[i];
      const prev = pts[i - 1] || p, next = pts[i + 1] || p;
      const dx = next.x - prev.x, dy = next.y - prev.y;
      const len = Math.hypot(dx, dy) || 1;
      const nx = -dy / len, ny = dx / len;
      out.push({ x: p.x + nx * dist, y: p.y + ny * dist });
    }
    return out;
  }

  function handlePositions(track) {
    const a = getNode(track.aId), b = getNode(track.bId);
    return {
      c1: { x: a.x + track.c1off.x, y: a.y + track.c1off.y },
      c2: { x: b.x + track.c2off.x, y: b.y + track.c2off.y },
    };
  }

  function distToSegment(p, v, w) {
    const l2 = (v.x - w.x) ** 2 + (v.y - w.y) ** 2;
    if (l2 === 0) return Math.hypot(p.x - v.x, p.y - v.y);
    let t = ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2;
    t = Math.max(0, Math.min(1, t));
    const proj = { x: v.x + t * (w.x - v.x), y: v.y + t * (w.y - v.y) };
    return Math.hypot(p.x - proj.x, p.y - proj.y);
  }

  function hitNode(x, y) {
    for (let i = nodes.length - 1; i >= 0; i--) {
      const n = nodes[i];
      if (Math.hypot(n.x - x, n.y - y) <= 12) return n;
    }
    return null;
  }

  function hitHandle(x, y) {
    if (!selected || selected.type !== 'track') return null;
    const track = getTrack(selected.id);
    if (!track) return null;
    const h = handlePositions(track);
    if (Math.hypot(h.c1.x - x, h.c1.y - y) <= 8) return { trackId: track.id, which: 'c1' };
    if (Math.hypot(h.c2.x - x, h.c2.y - y) <= 8) return { trackId: track.id, which: 'c2' };
    return null;
  }

  function hitTrack(x, y) {
    let best = null, bestDist = 10;
    for (const t of tracks) {
      const pts = trackPoints(t, 24);
      for (let i = 0; i < pts.length - 1; i++) {
        const d = distToSegment({ x, y }, pts[i], pts[i + 1]);
        if (d < bestDist) { bestDist = d; best = t; }
      }
    }
    return best;
  }

  function hitRoadNode(x, y) {
    for (let i = roadNodes.length - 1; i >= 0; i--) {
      const n = roadNodes[i];
      if (Math.hypot(n.x - x, n.y - y) <= 10) return n;
    }
    return null;
  }

  function hitRoadSegment(x, y) {
    let best = null, bestDist = 8;
    for (const s of roadSegments) {
      const a = getRoadNode(s.aId), b = getRoadNode(s.bId);
      if (!a || !b) continue;
      const d = distToSegment({ x, y }, a, b);
      if (d < bestDist) { bestDist = d; best = s; }
    }
    return best;
  }

  // Platform/shed center for one side of a facility ('side' is +1 or -1);
  // doubled facilities push the offset out past the second rail lane.
  function facilityPlatformCenter(f, side) {
    const extra = f.double ? DOUBLE_GAP / 2 : 0;
    const offset = (PLATFORM_OFFSET + extra) * side;
    return {
      x: f.x - Math.sin(f.angle) * offset,
      y: f.y + Math.cos(f.angle) * offset,
    };
  }

  function hitFacility(x, y) {
    for (let i = facilities.length - 1; i >= 0; i--) {
      const f = facilities[i];
      const sides = f.double ? [1, -1] : [1];
      for (const side of sides) {
        const c = facilityPlatformCenter(f, side);
        const dx = x - c.x, dy = y - c.y;
        const cos = Math.cos(-f.angle), sin = Math.sin(-f.angle);
        const lx = dx * cos - dy * sin, ly = dx * sin + dy * cos;
        if (Math.abs(lx) <= TRAIN_LENGTH / 2 && Math.abs(ly) <= PLATFORM_WIDTH / 2) return f;
      }
    }
    return null;
  }

  function facilityHandlePos(f) {
    const c = facilityPlatformCenter(f, 1);
    return {
      x: c.x + Math.cos(f.angle) * (TRAIN_LENGTH / 2 + 16),
      y: c.y + Math.sin(f.angle) * (TRAIN_LENGTH / 2 + 16),
    };
  }

  function hitFacilityHandle(x, y) {
    if (!selected || selected.type !== 'facility') return null;
    const f = getFacility(selected.id);
    if (!f) return null;
    const h = facilityHandlePos(f);
    return Math.hypot(h.x - x, h.y - y) <= 8 ? f.id : null;
  }

  // ---- rendering ----
  function drawGround(w, h) {
    ctx.fillStyle = '#3f7d4a';
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = 'rgba(255,255,255,0.06)';
    const grid = 48;
    for (let x = 0; x < w; x += grid) {
      for (let y = 0; y < h; y += grid) {
        ctx.beginPath();
        ctx.arc(x, y, 1.6, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  function drawRoadSegment(seg, isSelected) {
    const a = getRoadNode(seg.aId), b = getRoadNode(seg.bId);
    if (!a || !b) return;
    ctx.strokeStyle = isSelected ? '#5a5a5a' : '#403f3d';
    ctx.lineWidth = 20;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();

    ctx.strokeStyle = isSelected ? '#fff2c9' : '#e8d98a';
    ctx.lineWidth = 2;
    ctx.setLineDash([10, 10]);
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  function drawRoadNode(node, isSelected) {
    ctx.beginPath();
    ctx.arc(node.x, node.y, 5, 0, Math.PI * 2);
    ctx.fillStyle = isSelected ? '#fff2c9' : '#5a5a58';
    ctx.fill();
  }

  function drawCarVehicle(car) {
    ctx.save();
    ctx.translate(car.x, car.y);
    ctx.rotate(car.angle);

    ctx.beginPath();
    ctx.roundRect(-7, -4, 14, 8, 2.5);
    ctx.fillStyle = car.color;
    ctx.fill();
    ctx.strokeStyle = '#20201e';
    ctx.lineWidth = 1;
    ctx.stroke();

    // windshield toward the front, headlight tips
    ctx.fillStyle = 'rgba(200,225,235,0.85)';
    ctx.fillRect(1.5, -3, 3, 6);
    ctx.fillStyle = '#fff2c9';
    ctx.fillRect(6, -3, 1.5, 2);
    ctx.fillRect(6, 1, 1.5, 2);

    ctx.restore();
  }

  // A level crossing's default angle runs perpendicular to whichever way the
  // track passes through its rail node - a reasonable starting guess for
  // where the road crosses it when there's no road there yet. Once a road is
  // actually drawn through the node, crossingAngle is set to match it exactly.
  function defaultCrossingAngle(node) {
    const neigh = nodeNeighbors(node.id);
    let angle = 0;
    if (neigh.length > 0) {
      const other = getNode(neigh[0].otherId);
      angle = Math.atan2(other.y - node.y, other.x - node.x);
    }
    return angle + Math.PI / 2;
  }

  const CROSSING_PATCH_LEN = 16; // along the road
  const CROSSING_ROAD_HALF_WIDTH = 11; // across the road, matches road paving width

  function crossingHandlePos(node) {
    const r = CROSSING_PATCH_LEN + 26;
    return { x: node.x + Math.cos(node.crossingAngle) * r, y: node.y + Math.sin(node.crossingAngle) * r };
  }

  function hitCrossingHandle(x, y) {
    if (!selected || selected.type !== 'node') return null;
    const n = getNode(selected.id);
    if (!n || !n.crossing) return null;
    const h = crossingHandlePos(n);
    return Math.hypot(h.x - x, h.y - y) <= 8 ? n.id : null;
  }

  // A level crossing is a rail node flagged .crossing: crossingAngle is the
  // road's own direction through it (local +X after rotating), so the
  // striped patch sits square with the road, and .barrier (0=open..1=closed,
  // eased toward a train-triggered target in the animation loop) swings a
  // pair of gates from tucked alongside the road out to blocking it.
  function drawCrossing(node, isSelected) {
    const patchLen = CROSSING_PATCH_LEN;
    const half = CROSSING_ROAD_HALF_WIDTH;
    const barrier = node.barrier || 0;

    ctx.save();
    ctx.translate(node.x, node.y);
    ctx.rotate(node.crossingAngle);

    // road surface patch with diagonal hazard stripes
    ctx.save();
    ctx.beginPath();
    ctx.rect(-patchLen, -half, patchLen * 2, half * 2);
    ctx.clip();
    ctx.fillStyle = '#403f3d';
    ctx.fillRect(-patchLen, -half, patchLen * 2, half * 2);
    ctx.strokeStyle = '#e8c93d';
    ctx.lineWidth = 5;
    for (let s = -half * 4; s < patchLen * 2; s += 10) {
      ctx.beginPath();
      ctx.moveTo(-patchLen + s, -half);
      ctx.lineTo(-patchLen + s + half * 2, half);
      ctx.stroke();
    }
    ctx.restore();

    // striped gates pivoting at the road edge on each side of the track,
    // swinging from tucked alongside the road (open) to across it (closed)
    const armLen = half * 2;
    for (const side of [-1, 1]) {
      const openAngle = side > 0 ? 0 : Math.PI;
      const closedAngle = Math.PI / 2;
      const armAngle = openAngle + (closedAngle - openAngle) * barrier;
      ctx.save();
      ctx.translate(side * (patchLen + 6), -half);
      ctx.rotate(armAngle);
      for (let i = 0; i < 3; i++) {
        ctx.fillStyle = i % 2 === 0 ? '#e8c93d' : '#c0392b';
        ctx.fillRect(i * (armLen / 3), -2.5, armLen / 3 + 0.5, 5);
      }
      ctx.fillStyle = '#2a2a2a';
      ctx.beginPath();
      ctx.arc(0, 0, 2.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // alternating flashing lights on each post, lit only while barriers are
    // active - the two sides flash out of phase, like a real crossing
    const flashOn = Math.floor(simClock / 0.4) % 2 === 0;
    for (const side of [-1, 1]) {
      const lit = barrier > 0.05 && (side > 0 ? flashOn : !flashOn);
      ctx.beginPath();
      ctx.arc(side * (patchLen + 6), -half - 6, 3, 0, Math.PI * 2);
      ctx.fillStyle = lit ? '#ff3b30' : '#5a2020';
      ctx.fill();
      if (lit) {
        ctx.beginPath();
        ctx.arc(side * (patchLen + 6), -half - 6, 6, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,59,48,0.35)';
        ctx.fill();
      }
    }

    ctx.restore();

    if (isSelected) {
      const h = crossingHandlePos(node);
      ctx.strokeStyle = 'rgba(255,255,255,0.5)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(node.x, node.y);
      ctx.lineTo(h.x, h.y);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(h.x, h.y, 7, 0, Math.PI * 2);
      ctx.fillStyle = '#5cb3e8';
      ctx.fill();
      ctx.strokeStyle = '#1c4e6b';
      ctx.lineWidth = 2;
      ctx.stroke();
    }
  }

  function drawTrackLane(pts, isSelected) {
    if (pts.length < 2) return;

    // ballast
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (const p of pts) ctx.lineTo(p.x, p.y);
    ctx.strokeStyle = isSelected ? '#a68a5c' : '#8a7256';
    ctx.lineWidth = 16;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.stroke();

    // sleepers
    let acc = 0;
    const spacing = 16;
    ctx.strokeStyle = '#5a3f28';
    ctx.lineWidth = 5;
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[i], p1 = pts[i + 1];
      const segLen = Math.hypot(p1.x - p0.x, p1.y - p0.y);
      acc += segLen;
      if (acc >= spacing) {
        acc = 0;
        const dx = p1.x - p0.x, dy = p1.y - p0.y;
        const len = Math.hypot(dx, dy) || 1;
        const nx = -dy / len, ny = dx / len;
        const half = 9;
        ctx.beginPath();
        ctx.moveTo(p1.x - nx * half, p1.y - ny * half);
        ctx.lineTo(p1.x + nx * half, p1.y + ny * half);
        ctx.stroke();
      }
    }

    // rails (two parallel offset polylines)
    for (const side of [-4, 4]) {
      ctx.beginPath();
      for (let i = 0; i < pts.length; i++) {
        const p = pts[i];
        const prev = pts[i - 1] || p;
        const next = pts[i + 1] || p;
        const dx = next.x - prev.x, dy = next.y - prev.y;
        const len = Math.hypot(dx, dy) || 1;
        const nx = -dy / len, ny = dx / len;
        const ox = p.x + nx * side, oy = p.y + ny * side;
        if (i === 0) ctx.moveTo(ox, oy); else ctx.lineTo(ox, oy);
      }
      ctx.strokeStyle = isSelected ? '#fff2c9' : '#d9d2c2';
      ctx.lineWidth = 2.2;
      ctx.stroke();
    }
  }

  function drawTrack(track, isSelected) {
    const pts = trackPoints(track, 48);
    if (pts.length < 2) return;

    if (track.double) {
      drawTrackLane(offsetPolyline(pts, DOUBLE_GAP / 2), isSelected);
      drawTrackLane(offsetPolyline(pts, -DOUBLE_GAP / 2), isSelected);
    } else {
      drawTrackLane(pts, isSelected);
    }

    if (isSelected) {
      const h = handlePositions(track);
      ctx.strokeStyle = 'rgba(255,255,255,0.5)';
      ctx.lineWidth = 1.5;
      const a = getNode(track.aId), b = getNode(track.bId);
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(h.c1.x, h.c1.y); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(h.c2.x, h.c2.y); ctx.stroke();
      for (const p of [h.c1, h.c2]) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, 7, 0, Math.PI * 2);
        ctx.fillStyle = '#5cb3e8';
        ctx.fill();
        ctx.strokeStyle = '#1c4e6b';
        ctx.lineWidth = 2;
        ctx.stroke();
      }
    }
  }

  function drawFacility(f, isSelected) {
    const sides = f.double ? [1, -1] : [1];
    const offsetExtra = f.double ? DOUBLE_GAP / 2 : 0;

    for (const side of sides) {
      ctx.save();
      ctx.translate(f.x, f.y);
      ctx.rotate(f.angle);
      ctx.translate(0, (PLATFORM_OFFSET + offsetExtra) * side);

      ctx.beginPath();
      ctx.roundRect(-TRAIN_LENGTH / 2, -PLATFORM_WIDTH / 2, TRAIN_LENGTH, PLATFORM_WIDTH, 4);

      if (f.kind === 'depot') {
        ctx.fillStyle = isSelected ? '#8a5a48' : '#6b4534';
        ctx.fill();
        ctx.strokeStyle = '#3a251a';
        ctx.lineWidth = 2;
        ctx.stroke();

        // corrugated shed roof lines
        ctx.strokeStyle = 'rgba(0,0,0,0.25)';
        ctx.lineWidth = 1;
        for (let rx = -TRAIN_LENGTH / 2 + 8; rx < TRAIN_LENGTH / 2 - 8; rx += 10) {
          ctx.beginPath();
          ctx.moveTo(rx, -PLATFORM_WIDTH / 2 + 4);
          ctx.lineTo(rx, PLATFORM_WIDTH / 2 - 4);
          ctx.stroke();
        }

        // roller door
        ctx.fillStyle = '#e8c93d';
        ctx.fillRect(TRAIN_LENGTH / 2 - 14, -PLATFORM_WIDTH / 2 + 4, 10, PLATFORM_WIDTH - 8);
      } else {
        ctx.fillStyle = isSelected ? '#cdc6b2' : '#b5ae9c';
        ctx.fill();
        ctx.strokeStyle = '#5a5548';
        ctx.lineWidth = 2;
        ctx.stroke();

        // trackside tactile edge strip
        ctx.fillStyle = '#e8c93d';
        ctx.fillRect(-TRAIN_LENGTH / 2 + 4, PLATFORM_WIDTH / 2 - 6, TRAIN_LENGTH - 8, 4);
      }

      ctx.restore();
    }

    if (isSelected) {
      const h = facilityHandlePos(f);
      ctx.strokeStyle = 'rgba(255,255,255,0.5)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(f.x, f.y);
      ctx.lineTo(h.x, h.y);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(h.x, h.y, 7, 0, Math.PI * 2);
      ctx.fillStyle = '#5cb3e8';
      ctx.fill();
      ctx.strokeStyle = '#1c4e6b';
      ctx.lineWidth = 2;
      ctx.stroke();
    }
  }

  // 4-car Class 375 "Electrostar" in Southeastern livery, drawn as seen from
  // directly above. The train is articulated: each car is posed and rotated
  // independently along a `sampler(offset)` function that returns {x,y,angle}
  // for a signed distance from the train's own center - so on a curved route
  // each car bends to follow the track instead of the whole unit staying rigid.
  function makeRouteSampler(train) {
    return (offset) => trainPoseAt(train, train.pos + offset);
  }

  function drawCar(isFirstCar, isLastCar) {
    // roof, assumes already translated/rotated to the car's own center
    ctx.beginPath();
    ctx.roundRect(-CAR_LENGTH / 2, -TRAIN_WIDTH / 2, CAR_LENGTH, TRAIN_WIDTH, 6);
    ctx.fillStyle = livery.roof;
    ctx.fill();
    ctx.strokeStyle = '#23262a';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // livery edge stripes
    ctx.strokeStyle = livery.side;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-CAR_LENGTH / 2 + 3, -TRAIN_WIDTH / 2 + 2);
    ctx.lineTo(CAR_LENGTH / 2 - 3, -TRAIN_WIDTH / 2 + 2);
    ctx.moveTo(-CAR_LENGTH / 2 + 3, TRAIN_WIDTH / 2 - 2);
    ctx.lineTo(CAR_LENGTH / 2 - 3, TRAIN_WIDTH / 2 - 2);
    ctx.stroke();

    // roof-mounted aircon unit
    ctx.beginPath();
    ctx.roundRect(-9, -TRAIN_WIDTH * 0.22, 18, TRAIN_WIDTH * 0.44, 2);
    ctx.fillStyle = '#aeb3b2';
    ctx.fill();
    ctx.strokeStyle = '#7d8180';
    ctx.lineWidth = 1;
    ctx.stroke();

    // door tick-marks, two per side
    ctx.strokeStyle = '#5a5e5d';
    ctx.lineWidth = 1.5;
    for (const frac of [-0.22, 0.22]) {
      const dx = frac * CAR_LENGTH;
      ctx.beginPath();
      ctx.moveTo(dx, -TRAIN_WIDTH / 2);
      ctx.lineTo(dx, -TRAIN_WIDTH / 2 + 4);
      ctx.moveTo(dx, TRAIN_WIDTH / 2);
      ctx.lineTo(dx, TRAIN_WIDTH / 2 - 4);
      ctx.stroke();
    }

    // cab-end warning panel, only on the train's true leading/trailing ends
    if (isFirstCar || isLastCar) {
      ctx.fillStyle = livery.cab;
      const ex = isFirstCar ? -CAR_LENGTH / 2 : CAR_LENGTH / 2 - 5;
      ctx.fillRect(ex, -TRAIN_WIDTH / 2 + 2, 5, TRAIN_WIDTH - 4);
    }
  }

  function drawArticulatedTrain(sampler) {
    for (let i = 0; i < TRAIN_CARS; i++) {
      const centerOffset = -TRAIN_LENGTH / 2 + i * CAR_LENGTH + CAR_LENGTH / 2;
      const pose = sampler(centerOffset);
      ctx.save();
      ctx.translate(pose.x, pose.y);
      ctx.rotate(pose.angle);
      drawCar(i === 0, i === TRAIN_CARS - 1);
      if (i === 1) {
        // folded pantograph on car 2, seen from above
        ctx.strokeStyle = '#333';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(0, -6);
        ctx.lineTo(-4, 0);
        ctx.lineTo(0, 6);
        ctx.lineTo(4, 0);
        ctx.closePath();
        ctx.stroke();
      }
      ctx.restore();
    }

    // articulated couplers between cars, each following the curve at its own joint
    ctx.strokeStyle = '#3a3d3c';
    ctx.lineWidth = 2.5;
    for (let i = 1; i < TRAIN_CARS; i++) {
      const jointOffset = -TRAIN_LENGTH / 2 + i * CAR_LENGTH;
      const pose = sampler(jointOffset);
      const nx = -Math.sin(pose.angle), ny = Math.cos(pose.angle);
      const half = TRAIN_WIDTH / 2 - 3;
      ctx.beginPath();
      ctx.moveTo(pose.x - nx * half, pose.y - ny * half);
      ctx.lineTo(pose.x + nx * half, pose.y + ny * half);
      ctx.stroke();
    }
  }

  function drawNode(node, isSelected, isPending) {
    const r = node.double ? 11 : 9;

    // shadow pad
    ctx.beginPath();
    ctx.ellipse(node.x, node.y + 2, r * 1.3, r, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,0.22)';
    ctx.fill();

    ctx.beginPath();
    ctx.arc(node.x, node.y, r, 0, Math.PI * 2);
    ctx.fillStyle = isPending ? '#5cb3e8' : (isSelected ? '#ffd27a' : '#e8a33d');
    ctx.fill();
    ctx.strokeStyle = '#3a2410';
    ctx.lineWidth = 2.5;
    ctx.stroke();

    if (node.double) {
      ctx.beginPath();
      ctx.arc(node.x, node.y, r - 4, 0, Math.PI * 2);
      ctx.strokeStyle = '#3a2410';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.arc(node.x, node.y, 3, 0, Math.PI * 2);
      ctx.fillStyle = '#3a2410';
      ctx.fill();
    }
  }

  function drawPassenger(p) {
    if (p.state === 'riding' || p.state === 'arrived') return;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
    ctx.fillStyle = p.color;
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.4)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // Passengers riding a train are invisible as separate dots (they boarded),
  // but still need to visibly read as "on the train" - draw them as small
  // dots at window positions along its cars, following its live curved pose.
  function drawRidingPassengers(tr) {
    const aboard = passengers.filter(p => p.state === 'riding' && p.trainId === tr.id);
    if (aboard.length === 0) return;
    const sampler = makeRouteSampler(tr);
    aboard.forEach((p, i) => {
      const car = i % TRAIN_CARS;
      const carCenterOffset = -TRAIN_LENGTH / 2 + car * CAR_LENGTH + CAR_LENGTH / 2;
      const along = ((Math.floor(i / TRAIN_CARS) % 3) - 1) * (CAR_LENGTH * 0.28);
      const pose = sampler(carCenterOffset + along);
      ctx.beginPath();
      ctx.arc(pose.x, pose.y, 2.6, 0, Math.PI * 2);
      ctx.fillStyle = p.color;
      ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.5)';
      ctx.lineWidth = 0.8;
      ctx.stroke();
    });
  }

  function drawPendingRoute() {
    if (!pendingRoute || pendingRoute.path.length < 1) return;
    ctx.strokeStyle = '#5cb3e8';
    ctx.lineWidth = 4;
    ctx.setLineDash([8, 6]);
    ctx.beginPath();
    for (let i = 0; i < pendingRoute.path.length - 1; i++) {
      const track = trackBetween(pendingRoute.path[i], pendingRoute.path[i + 1]);
      if (!track) continue;
      const pts = trackPoints(track, 24);
      const startNode = getNode(pendingRoute.path[i]);
      const ordered = Math.hypot(pts[0].x - startNode.x, pts[0].y - startNode.y) > 1 ? pts.slice().reverse() : pts;
      ctx.moveTo(ordered[0].x, ordered[0].y);
      for (const p of ordered) ctx.lineTo(p.x, p.y);
    }
    ctx.stroke();
    ctx.setLineDash([]);
    const lastId = pendingRoute.path[pendingRoute.path.length - 1];
    const last = getNode(lastId);
    if (last) {
      ctx.beginPath();
      ctx.arc(last.x, last.y, 13, 0, Math.PI * 2);
      ctx.strokeStyle = '#5cb3e8';
      ctx.lineWidth = 2.5;
      ctx.stroke();
    }
  }

  function draw() {
    const w = window.innerWidth, h = window.innerHeight;
    drawGround(w, h);

    for (const s of roadSegments) {
      drawRoadSegment(s, selected && selected.type === 'roadSegment' && selected.id === s.id);
    }
    for (const n of roadNodes) {
      drawRoadNode(n, selected && selected.type === 'roadNode' && selected.id === n.id);
    }
    for (const c of cars) {
      drawCarVehicle(c);
    }
    for (const t of tracks) {
      drawTrack(t, selected && selected.type === 'track' && selected.id === t.id);
    }
    for (const f of facilities) {
      const isSelected = selected && selected.type === 'facility' && selected.id === f.id;
      drawFacility(f, isSelected);
    }
    for (const n of nodes) {
      const isSelected = selected && selected.type === 'node' && selected.id === n.id;
      const isPending = pendingConnectNode === n.id;
      drawNode(n, isSelected, isPending);
      if (n.crossing) drawCrossing(n, isSelected);
    }
    for (const tr of trains) {
      drawArticulatedTrain(makeRouteSampler(tr));
      drawRidingPassengers(tr);
    }
    for (const p of passengers) {
      drawPassenger(p);
    }

    drawPendingRoute();

    if (dragging && dragging.type === 'newFacility') {
      ctx.globalAlpha = 0.55;
      drawFacility({ x: dragging.cx, y: dragging.cy, angle: dragging.angle, kind: dragging.kind, double: doubleTrack }, false);
      ctx.globalAlpha = 1;
    }
    if (mode === 'road' && lastRoadNodeId != null && mouse) {
      const start = getRoadNode(lastRoadNodeId);
      if (start) {
        const snapped = snapToGrid(mouse.x, mouse.y);
        const rail = nearbyRailNode(snapped.x, snapped.y);
        const target = rail || snapped;
        ctx.globalAlpha = 0.5;
        ctx.strokeStyle = isGridDirection(start, target) ? '#e8d98a' : '#e8734d';
        ctx.lineWidth = 6;
        ctx.setLineDash([6, 6]);
        ctx.beginPath();
        ctx.moveTo(start.x, start.y);
        ctx.lineTo(target.x, target.y);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.globalAlpha = 1;
      }
    }

    nodeCountEl.textContent = nodes.length;
    trackCountEl.textContent = tracks.length;
    facilityCountEl.textContent = facilities.length;
    trainCountEl.textContent = trains.length;
    passengerCountEl.textContent = passengers.length;
    roadCountEl.textContent = roadSegments.length;
    carCountEl.textContent = cars.length;
  }

  // ---- interaction ----
  function setMode(m) {
    mode = m;
    pendingConnectNode = null;
    if (m !== 'route') pendingRoute = null;
    if (m !== 'road') lastRoadNodeId = null;
    selected = null;
    document.querySelectorAll('button.tool[data-mode]').forEach(b => {
      b.classList.toggle('active', b.dataset.mode === m);
    });
    updateHint();
    draw();
  }

  function updateHint() {
    if (mode === 'node') hint.textContent = 'Click empty ground to place a rail node.';
    else if (mode === 'connect') hint.textContent = pendingConnectNode
      ? 'Now click a second node to lay track between them.'
      : 'Click a node to start a connection.';
    else if (mode === 'station') hint.textContent = 'Click and drag from an existing rail node to build a station - it lays its own track and a platform locked to the train\'s length; drag just sets the angle.';
    else if (mode === 'depot') hint.textContent = 'Click and drag from an existing rail node to build a depot - a shed where trains spawn.';
    else if (mode === 'route') hint.textContent = pendingRoute
      ? `Route has ${pendingRoute.path.length} stop(s) - click more nodes to extend it, or press Spawn Train. Esc to cancel.`
      : 'Click a depot\'s track node to start a route.';
    else if (mode === 'road') hint.textContent = 'Click to place a road point on the grid. Click another point in one of the 8 grid directions (N/S/E/W or diagonal) to pave a road between them - keeps chaining from the last point. Esc to break the chain.';
    else if (mode === 'crossing') hint.textContent = 'Click a rail node to toggle a level crossing there.';
    else if (mode === 'select') hint.textContent = 'Drag nodes or facilities to move them. Click a track, facility, or crossing to bend/rotate it (drag blue handles). Press Delete to remove selection.';
  }

  document.querySelectorAll('button.tool[data-mode]').forEach(b => {
    b.addEventListener('click', () => setMode(b.dataset.mode));
  });

  const doubleToggleBtn = document.getElementById('doubleToggle');
  doubleToggleBtn.addEventListener('click', () => {
    doubleTrack = !doubleTrack;
    doubleToggleBtn.textContent = 'Double Track: ' + (doubleTrack ? 'On' : 'Off');
    doubleToggleBtn.classList.toggle('active', doubleTrack);
  });

  const roofColorInput = document.getElementById('roofColor');
  const sideColorInput = document.getElementById('sideColor');
  const cabColorInput = document.getElementById('cabColor');
  function syncLiveryInputs() {
    roofColorInput.value = livery.roof;
    sideColorInput.value = livery.side;
    cabColorInput.value = livery.cab;
  }
  roofColorInput.addEventListener('input', () => { livery.roof = roofColorInput.value; save(); draw(); });
  sideColorInput.addEventListener('input', () => { livery.side = sideColorInput.value; save(); draw(); });
  cabColorInput.addEventListener('input', () => { livery.cab = cabColorInput.value; save(); draw(); });

  document.getElementById('spawnBtn').addEventListener('click', () => {
    if (!pendingRoute || pendingRoute.path.length < 2) {
      hint.textContent = 'Build a route first: switch to Route mode, click a depot\'s node, then more nodes.';
      return;
    }
    spawnTrain(pendingRoute.depotId, pendingRoute.path);
    pendingRoute = null;
    updateHint();
    draw();
  });

  document.getElementById('clearBtn').addEventListener('click', () => {
    if (nodes.length === 0 && tracks.length === 0 && facilities.length === 0 && trains.length === 0
      && roadNodes.length === 0 && roadSegments.length === 0) return;
    if (confirm('Clear the entire track layout?')) {
      nodes = []; tracks = []; facilities = []; trains = []; roadNodes = []; roadSegments = []; cars = [];
      selected = null; pendingConnectNode = null; pendingRoute = null; lastRoadNodeId = null;
      save(); draw();
    }
  });

  function getMousePos(e) {
    const rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  canvas.addEventListener('mousedown', (e) => {
    const p = getMousePos(e);

    if (mode === 'node') {
      if (!hitNode(p.x, p.y)) addNode(p.x, p.y);
      draw();
      return;
    }

    if (mode === 'connect') {
      const n = hitNode(p.x, p.y);
      if (!n) { pendingConnectNode = null; updateHint(); draw(); return; }
      if (pendingConnectNode === null) {
        pendingConnectNode = n.id;
      } else if (pendingConnectNode === n.id) {
        pendingConnectNode = null;
      } else {
        addTrack(pendingConnectNode, n.id);
        pendingConnectNode = null;
      }
      updateHint();
      draw();
      return;
    }

    if (mode === 'station' || mode === 'depot') {
      const n = hitNode(p.x, p.y);
      if (!n) { hint.textContent = 'Start the drag on an existing rail node to anchor it.'; return; }
      dragging = { type: 'newFacility', kind: mode, nodeId: n.id, startX: n.x, startY: n.y, cx: n.x, cy: n.y, angle: 0 };
      draw();
      return;
    }

    if (mode === 'route') {
      const n = hitNode(p.x, p.y);
      if (!n) return;
      if (!pendingRoute) {
        const dep = facilities.find(f => f.kind === 'depot' && (f.nodeId === n.id || f.farNodeId === n.id));
        if (!dep) { hint.textContent = 'Start a route by clicking a depot\'s track node.'; draw(); return; }
        pendingRoute = { depotId: dep.id, path: [n.id] };
      } else {
        const last = pendingRoute.path[pendingRoute.path.length - 1];
        if (n.id !== last) {
          const seg = shortestPath(last, n.id);
          if (!seg) { hint.textContent = 'No track connects to that node yet.'; draw(); return; }
          pendingRoute.path = pendingRoute.path.concat(seg.slice(1));
        }
      }
      updateHint();
      draw();
      return;
    }

    if (mode === 'road') {
      const snapped = snapToGrid(p.x, p.y);
      const rail = nearbyRailNode(snapped.x, snapped.y);
      const node = rail ? addRoadNodeAt(rail.x, rail.y) : addRoadNode(snapped.x, snapped.y);

      if (lastRoadNodeId != null && lastRoadNodeId !== node.id) {
        const start = getRoadNode(lastRoadNodeId);
        if (isGridDirection(start, node)) {
          addRoadSegment(lastRoadNodeId, node.id);
          if (rail) {
            rail.crossing = true;
            rail.crossingAngle = Math.atan2(node.y - start.y, node.x - start.x);
            if (rail.barrier == null) rail.barrier = 0;
          }
        } else {
          hint.textContent = 'That point isn\'t on one of the 8 grid directions from the last one - starting a new road there instead.';
        }
      } else if (rail) {
        // starting a fresh chain exactly on a rail node - flag the crossing now,
        // its angle gets refined once a road segment actually runs through it
        rail.crossing = true;
        if (rail.crossingAngle == null) rail.crossingAngle = defaultCrossingAngle(rail);
        if (rail.barrier == null) rail.barrier = 0;
      }

      lastRoadNodeId = node.id;
      save();
      draw();
      return;
    }

    if (mode === 'crossing') {
      const n = hitNode(p.x, p.y);
      if (!n) { hint.textContent = 'Click an existing rail node to toggle a level crossing.'; return; }
      n.crossing = !n.crossing;
      if (n.crossing && n.crossingAngle == null) n.crossingAngle = defaultCrossingAngle(n);
      save();
      draw();
      return;
    }

    if (mode === 'select') {
      const h = hitHandle(p.x, p.y);
      if (h) { dragging = { type: 'handle', ...h }; return; }

      const fh = hitFacilityHandle(p.x, p.y);
      if (fh) { dragging = { type: 'facilityHandle', id: fh }; return; }

      const ch = hitCrossingHandle(p.x, p.y);
      if (ch) { dragging = { type: 'crossingHandle', id: ch }; return; }

      const n = hitNode(p.x, p.y);
      if (n) {
        selected = { type: 'node', id: n.id };
        dragging = { type: 'node', id: n.id };
        draw();
        return;
      }

      const t = hitTrack(p.x, p.y);
      if (t) {
        selected = { type: 'track', id: t.id };
        draw();
        return;
      }

      const f = hitFacility(p.x, p.y);
      if (f) {
        selected = { type: 'facility', id: f.id };
        dragging = { type: 'facility', id: f.id, offX: p.x - f.x, offY: p.y - f.y };
        draw();
        return;
      }

      const rn = hitRoadNode(p.x, p.y);
      if (rn) {
        selected = { type: 'roadNode', id: rn.id };
        draw();
        return;
      }

      const rs = hitRoadSegment(p.x, p.y);
      if (rs) {
        selected = { type: 'roadSegment', id: rs.id };
        draw();
        return;
      }

      selected = null;
      draw();
    }
  });

  canvas.addEventListener('mousemove', (e) => {
    mouse = getMousePos(e);
    if (mode === 'road' && lastRoadNodeId != null) draw();
    if (!dragging) return;

    if (dragging.type === 'node') {
      const n = getNode(dragging.id);
      if (n) { n.x = mouse.x; n.y = mouse.y; recomputeAutoTangents(); draw(); }
    } else if (dragging.type === 'handle') {
      const t = getTrack(dragging.trackId);
      if (!t) return;
      if (dragging.which === 'c1') {
        const a = getNode(t.aId);
        t.c1off = { x: mouse.x - a.x, y: mouse.y - a.y };
        t.c1locked = true;
      } else {
        const b = getNode(t.bId);
        t.c2off = { x: mouse.x - b.x, y: mouse.y - b.y };
        t.c2locked = true;
      }
      draw();
    } else if (dragging.type === 'facility') {
      const f = getFacility(dragging.id);
      if (f) { f.x = mouse.x - dragging.offX; f.y = mouse.y - dragging.offY; draw(); }
    } else if (dragging.type === 'facilityHandle') {
      const f = getFacility(dragging.id);
      if (f) { f.angle = Math.atan2(mouse.y - f.y, mouse.x - f.x); draw(); }
    } else if (dragging.type === 'crossingHandle') {
      const n = getNode(dragging.id);
      if (n) { n.crossingAngle = Math.atan2(mouse.y - n.y, mouse.x - n.x); draw(); }
    } else if (dragging.type === 'newFacility') {
      const dx = mouse.x - dragging.startX, dy = mouse.y - dragging.startY;
      const dist = Math.hypot(dx, dy);
      dragging.angle = dist > 3 ? Math.atan2(dy, dx) : 0;
      dragging.cx = dragging.startX + Math.cos(dragging.angle) * TRAIN_LENGTH / 2;
      dragging.cy = dragging.startY + Math.sin(dragging.angle) * TRAIN_LENGTH / 2;
      draw();
    }
  });

  window.addEventListener('mouseup', () => {
    if (dragging && dragging.type === 'newFacility') {
      const anchor = getNode(dragging.nodeId);
      const farX = dragging.startX + Math.cos(dragging.angle) * TRAIN_LENGTH;
      const farY = dragging.startY + Math.sin(dragging.angle) * TRAIN_LENGTH;
      const farNode = addNode(farX, farY);
      const track = addTrack(anchor.id, farNode.id);
      // keep the facility's own track dead straight so the platform never
      // drifts out of alignment with it, even if auto-tangent smoothing
      // later bends other tracks meeting at the anchor node
      const dx = (farNode.x - anchor.x) / 3, dy = (farNode.y - anchor.y) / 3;
      track.c1off = { x: dx, y: dy };
      track.c2off = { x: -dx, y: -dy };
      track.c1locked = true;
      track.c2locked = true;
      track.double = doubleTrack;
      addFacility(dragging.kind, dragging.cx, dragging.cy, dragging.angle, anchor.id, farNode.id, track.id);
      dragging = null;
      save();
      draw();
      return;
    }
    if (dragging) { dragging = null; save(); }
  });

  window.addEventListener('keydown', (e) => {
    if ((e.key === 'Delete' || e.key === 'Backspace') && selected) {
      if (selected.type === 'node') deleteNode(selected.id);
      else if (selected.type === 'track') deleteTrack(selected.id);
      else if (selected.type === 'facility') deleteFacility(selected.id);
      else if (selected.type === 'roadNode') deleteRoadNode(selected.id);
      else if (selected.type === 'roadSegment') deleteRoadSegment(selected.id);
      selected = null;
      draw();
    } else if (e.key === 'Escape' && pendingRoute) {
      pendingRoute = null;
      updateHint();
      draw();
    } else if (e.key === 'Escape' && mode === 'road' && lastRoadNodeId != null) {
      lastRoadNodeId = null;
      draw();
    }
  });

  // ---- train animation loop ----
  let lastTick = null;
  let simClock = 0; // seconds, drives the crossing lights' flash
  // A rail node flagged .crossing sitting exactly at this road node's
  // position (roads snap onto crossings exactly, so this is a plain equality
  // check), or null if this road point isn't a crossing.
  function crossingAtRoadNode(roadNodeId) {
    const rn = getRoadNode(roadNodeId);
    if (!rn) return null;
    return nodes.find(n => n.crossing && n.x === rn.x && n.y === rn.y) || null;
  }

  function carNeighbors(nodeId, excludeId) {
    const all = roadSegments.filter(s => s.aId === nodeId || s.bId === nodeId)
      .map(s => s.aId === nodeId ? s.bId : s.aId);
    const filtered = excludeId == null ? all : all.filter(id => id !== excludeId);
    return filtered.length ? filtered : all; // double back at a dead end rather than getting stuck
  }

  function spawnCar() {
    if (roadNodes.length < 2 || cars.length >= MAX_CARS) return;
    const start = roadNodes[Math.floor(Math.random() * roadNodes.length)];
    const options = carNeighbors(start.id, null);
    if (options.length === 0) return;
    const toId = options[Math.floor(Math.random() * options.length)];
    cars.push({
      id: uid(), fromId: start.id, toId, t: 0, x: start.x, y: start.y, angle: 0,
      speed: CAR_SPEED, color: CAR_COLORS[Math.floor(Math.random() * CAR_COLORS.length)],
      state: 'driving',
    });
  }

  // Cars wander the road graph, picking a random onward road at each
  // junction (avoiding an immediate U-turn where another option exists), and
  // halt just short of a road point that's a level crossing with its
  // barriers down, resuming once they ease back open.
  function tickCar(car, dt) {
    if (car.state === 'waiting') {
      const crossing = crossingAtRoadNode(car.toId);
      if (!crossing || (crossing.barrier || 0) < 0.3) car.state = 'driving';
      return;
    }

    const a = getRoadNode(car.fromId), b = getRoadNode(car.toId);
    if (!a || !b) { car.state = 'dead'; return; }

    const segLen = Math.hypot(b.x - a.x, b.y - a.y) || 1;
    const nextT = car.t + (car.speed * dt) / segLen;
    const crossing = crossingAtRoadNode(car.toId);

    if (crossing && (crossing.barrier || 0) > 0.3 && nextT >= CAR_STOP_T && car.t < CAR_STOP_T) {
      car.t = CAR_STOP_T;
      car.state = 'waiting';
    } else if (nextT >= 1) {
      const arrivedFrom = car.fromId;
      car.fromId = car.toId;
      car.t = 0;
      const options = carNeighbors(car.fromId, arrivedFrom);
      car.toId = options[Math.floor(Math.random() * options.length)];
    } else {
      car.t = nextT;
    }

    const na = getRoadNode(car.fromId), nb = getRoadNode(car.toId);
    if (na && nb) {
      car.x = na.x + (nb.x - na.x) * car.t;
      car.y = na.y + (nb.y - na.y) * car.t;
      car.angle = Math.atan2(nb.y - na.y, nb.x - na.x);
    } else {
      car.state = 'dead';
    }
  }

  function stationList() { return facilities.filter(f => f.kind === 'station'); }

  function passengerSpawnPos(f) {
    const c = facilityPlatformCenter(f, 1);
    const along = (Math.random() - 0.5) * (TRAIN_LENGTH - 20);
    const across = (Math.random() - 0.5) * (PLATFORM_WIDTH - 10);
    return {
      x: c.x + Math.cos(f.angle) * along - Math.sin(f.angle) * across,
      y: c.y + Math.sin(f.angle) * along + Math.cos(f.angle) * across,
    };
  }

  function spawnPassenger() {
    const stations = stationList();
    if (stations.length < 2) return;
    const origin = stations[Math.floor(Math.random() * stations.length)];
    let dest;
    do { dest = stations[Math.floor(Math.random() * stations.length)]; } while (dest.id === origin.id);
    const pos = passengerSpawnPos(origin);
    passengers.push({
      id: uid(),
      originId: origin.id, destId: dest.id, atStationId: origin.id,
      state: 'waiting', x: pos.x, y: pos.y,
      color: PASSENGER_COLORS[Math.floor(Math.random() * PASSENGER_COLORS.length)],
      trainId: null, walk: null,
    });
  }

  // A waiting passenger walks directly to their destination if it's a
  // nearby station; otherwise they stay put until a train that will reach
  // it dwells here (handleStationStop below boards them onto it).
  function tickPassenger(p, dt) {
    if (p.state === 'waiting') {
      if (p.atStationId === p.destId) { p.state = 'arrived'; return; }
      const originF = getFacility(p.atStationId);
      const destF = getFacility(p.destId);
      if (!originF || !destF) { p.state = 'arrived'; return; }
      const oc = facilityPlatformCenter(originF, 1), dc = facilityPlatformCenter(destF, 1);
      const dist = Math.hypot(dc.x - oc.x, dc.y - oc.y);
      if (dist <= WALK_DISTANCE) {
        p.state = 'walking';
        p.walk = { fromId: p.atStationId, toId: p.destId, t: 0, duration: Math.max(1, dist / WALK_SPEED) };
      }
    } else if (p.state === 'walking') {
      p.walk.t += dt;
      const frac = Math.min(1, p.walk.t / p.walk.duration);
      const originF = getFacility(p.walk.fromId), destF = getFacility(p.walk.toId);
      if (!originF || !destF) { p.state = 'arrived'; return; }
      const oc = facilityPlatformCenter(originF, 1), dc = facilityPlatformCenter(destF, 1);
      p.x = oc.x + (dc.x - oc.x) * frac;
      p.y = oc.y + (dc.y - oc.y) * frac;
      if (frac >= 1) {
        p.atStationId = p.walk.toId;
        p.walk = null;
        p.state = 'waiting';
      }
    }
  }

  // Called whenever a train dwells at a station: drop off any passengers
  // riding it whose destination is here, then board waiting passengers this
  // train's route will eventually carry to their own destination.
  function handleStationStop(tr, facilityId) {
    if (facilityId == null) return;
    passengers = passengers.filter(p => !(p.state === 'riding' && p.trainId === tr.id && p.destId === facilityId));
    const reachable = new Set(tr.stationStops.map(st => st.facilityId));
    if (tr.startFacilityId != null) reachable.add(tr.startFacilityId);
    if (tr.endFacilityId != null) reachable.add(tr.endFacilityId);
    for (const p of passengers) {
      if (p.state === 'waiting' && p.atStationId === facilityId && reachable.has(p.destId)) {
        p.state = 'riding';
        p.trainId = tr.id;
      }
    }
  }

  function tickTrain(tr, dt) {
    if (tr.state === 'waiting') {
      tr.waitTimer -= dt;
      if (tr.waitTimer <= 0) {
        tr.state = 'running';
        if (tr.pendingDir != null) { tr.dir = tr.pendingDir; tr.pendingDir = null; }
      }
      return;
    }

    const prevPos = tr.pos;
    const nextPos = tr.pos + tr.speed * tr.dir * dt;

    // stop and dwell at any station stop crossed on this step (except the
    // one just departed from, so it doesn't re-trigger the instant it moves)
    let stopHit = null;
    for (const st of tr.stationStops) {
      if (st.dist === tr.lastStopDist) continue;
      const crossed = tr.dir > 0
        ? (prevPos < st.dist && nextPos >= st.dist)
        : (prevPos > st.dist && nextPos <= st.dist);
      if (crossed) { stopHit = st; break; }
    }

    if (stopHit) {
      tr.pos = stopHit.dist;
      tr.state = 'waiting';
      tr.waitTimer = STOP_SECONDS;
      tr.pendingDir = tr.dir; // same direction after a station dwell
      tr.lastStopDist = stopHit.dist;
      handleStationStop(tr, stopHit.facilityId);
      return;
    }

    if (nextPos >= tr.total) {
      tr.pos = tr.total;
      tr.state = 'waiting';
      tr.waitTimer = STOP_SECONDS;
      tr.pendingDir = -1;
      tr.lastStopDist = null;
      handleStationStop(tr, tr.endFacilityId);
    } else if (nextPos <= 0) {
      tr.pos = 0;
      tr.state = 'waiting';
      tr.waitTimer = STOP_SECONDS;
      tr.pendingDir = 1;
      tr.lastStopDist = null;
      handleStationStop(tr, tr.startFacilityId);
    } else {
      tr.pos = nextPos;
      if (tr.lastStopDist != null && Math.abs(tr.pos - tr.lastStopDist) > 4) tr.lastStopDist = null;
    }
  }

  // Lowers a crossing's barriers when any train is within CROSSING_TRIGGER_DIST
  // of it, easing the animated .barrier value toward 0 (open) or 1 (closed).
  function tickCrossings(dt) {
    for (const n of nodes) {
      if (!n.crossing) continue;
      let active = false;
      for (const tr of trains) {
        const pose = trainPoseAt(tr, tr.pos);
        if (Math.hypot(pose.x - n.x, pose.y - n.y) < CROSSING_TRIGGER_DIST) { active = true; break; }
      }
      const target = active ? 1 : 0;
      const current = n.barrier || 0;
      n.barrier = current + (target - current) * Math.min(1, dt * 4);
    }
  }

  function animate(ts) {
    if (lastTick != null) {
      const dt = Math.min(0.05, (ts - lastTick) / 1000);

      simClock += dt;
      for (const tr of trains) tickTrain(tr, dt);
      tickCrossings(dt);

      passengerSpawnTimer += dt;
      if (passengerSpawnTimer >= PASSENGER_SPAWN_SECONDS) {
        passengerSpawnTimer = 0;
        spawnPassenger();
      }
      for (const p of passengers) tickPassenger(p, dt);
      passengers = passengers.filter(p => p.state !== 'arrived');

      carSpawnTimer += dt;
      if (carSpawnTimer >= CAR_SPAWN_SECONDS) {
        carSpawnTimer = 0;
        spawnCar();
      }
      for (const c of cars) tickCar(c, dt);
      cars = cars.filter(c => c.state !== 'dead');

      if (trains.length > 0 || passengers.length > 0 || cars.length > 0) draw();
    }
    lastTick = ts;
    requestAnimationFrame(animate);
  }

  load();
  syncLiveryInputs();
  recomputeAutoTangents();
  resize();
  setMode('node');
  requestAnimationFrame(animate);
})();
</script>
